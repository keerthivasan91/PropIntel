name: propintel

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: propintel
      MYSQL_USER: propintel_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
    volumes:
      - propintel_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    cpus: 0.75
    networks:
      - propintel

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      HOST: 0.0.0.0
      PORT: "5051"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5051:5051"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5051/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    cpus: 0.75
    networks:
      - propintel

  web:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5052:80"
    mem_limit: 128m
    cpus: 0.50
    networks:
      - propintel

volumes:
  propintel_mysql_data:

networks:
  propintel:
    driver: bridge
